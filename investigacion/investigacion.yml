# Perfil investigador. Fuente: CVN de Asun (nov. 2026; no se sube al repositorio).
# Este fichero alimenta la línea temporal y las listas de investigacion/index.qmd.
# Los proyectos y contratos NO van aquí: salen de proyectos/proyectos.yml
# (los que tienen los campos `linea`, `desde` y `hasta`).
#
# Cada entrada tiene un campo `clase`:
#   linea        línea de investigación: id, title, description, orden, activa (true si sigue en curso)
#   etapa        etapa profesional: title, corto (texto dentro de la barra), desde, hasta (vacío = hoy), fila (1 o 2)
#                con `punto: true` es un hito puntual (solo `desde`)
#   publicacion  title, autores, fuente, anio, tipo (Artículo | Capítulo | Actas | Libro | Informe | Divulgación),
#                linea (id de la línea), path (DOI o enlace, opcional), blog (entrada relacionada, opcional)
#   tesis        tesis dirigida o propia: title, autores, fuente, anio, linea, blog (opcional)
# Ids de línea: bayes | ambiente | salud | educacion | ia | sociedad

# =================== Líneas ===================
- clase: linea
  id: bayes
  orden: 1
  title: "Métodos bayesianos y teoría estadística"
  description: "Mi punto de partida. Una tesis bayesiana sobre replicación de experimentos y meta-análisis, dirigida por M. J. Bayarri en la Universitat de València, seguida de trabajos metodológicos sobre entropía y distancias (estos desde una perspectiva frecuentista), diseño bayesiano en sistemas de colas, modelos jerárquicos espaciales y mapas genéticos."

- clase: linea
  id: ambiente
  orden: 2
  title: "Medio ambiente, agronomía y alimentación"
  description: "Hacia 2001 empiezan las colaboraciones con equipos multidisciplinares: suelos mediterráneos afectados por incendios, compostaje y lodos de depuradora estudiados con espectroscopía en el infrarrojo cercano (NIR), genética de cítricos y productos cárnicos con chía y quinoa."

- clase: linea
  id: salud
  orden: 3
  activa: true
  title: "Salud y epidemiología"
  description: "Estadística con datos clínicos y epidemiológicos: hospitalizaciones de personas con VIH, incidencia de la COVID-19, meta-análisis en cardiología y asistencia estadística a los másteres de la Fundación Casa del Corazón."

- clase: linea
  id: educacion
  orden: 4
  title: "Educación, innovación y espacios educativos"
  description: "Nace de mis años en la gestión de la innovación docente: competencia digital del futuro profesorado de Secundaria, espacios educativos sostenibles (confort acústico, térmico y lumínico, ODS), evaluación y trabajos interdisciplinares."

- clase: linea
  id: ia
  orden: 5
  activa: true
  title: "Predicción e inteligencia artificial"
  description: "La línea en la que trabajo ahora: investigación metodológica a partir de problemas con datos reales en salud y economía, buscando modelos de predicción eficaces con procedimientos automatizados. Tiene antecedentes en estudios de estimación y previsión."

- clase: linea
  id: sociedad
  orden: 6
  title: "Estudios y asesoría estadística"
  description: "Convenios y contratos con administraciones, empresas y asociaciones para responder con datos a preguntas concretas."

