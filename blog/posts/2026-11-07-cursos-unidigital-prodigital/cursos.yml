  horas: 2 h
  description: Para la creación, reutilización y protección de contenidos educativos digitales es fundamental conocer los tipos y características básicas de los licenciamientos existentes. Hablamos sobre la permisibilidad de uso con fines educativos en función del tipo de licencia, y en particular de las licencias Creative Commons. Hablamos sobre la gestión y compartición eficaz de contenidos digitales a través de criterios estándar de catalogación, y ofrecemos recursos y pautas para recopilar, seleccionar, organizar y compartir eficazmente contenidos digitales.
  objetivos: Conocer el uso y creación de licencias abiertas y recursos educativos abiertos, incluyendo su correcta atribución.
  contenidos: Tipos de licenciamiento de objetos digitales. Creative Commons. Catalogación de recursos digitales. Curación y agregadores de contenidos para compartir.
  evaluacion: Cuestionario tipo test
  profesorado: Asunción M. Mayoral, Francisco J. Montiel Ruiz, F. Javier Amérigo Moreno y Federico Botella (Departamento de Estadística, Matemáticas e Informática)
