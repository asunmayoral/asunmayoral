# Catálogo de recursos. Una entrada por recurso.
# Campos:
#   title        título
#   description  una o dos frases (completa; se usa en el buscador)
#   resumen      (opcional) versión corta para la tarjeta, si `description` pasa de unos 110 caracteres
#   path         enlace (externo o interno)
#   date         AAAA-MM-DD aproximada (ordena el catálogo; si solo sabes el año, usa el 1 de enero)
#   anio         lo que se muestra como fecha (texto libre: "2022", "2023-24", "Web")
#   tipo         uno de: Asignatura, Curso, Taller, Libro, Apuntes y prácticas, Recopilatorio, Vídeo, Datos, Juego
#   temas        lista con valores de: Estadística-CC Datos, IA, Bayesiana, Mejora de procesos,
#                Innovación educativa, Comunicación científica, Competencia digital (la materia, no el lenguaje)
#   lenguaje     (opcional) lista con R y/o Python, si el recurso usa código. Si un curso tiene materiales
#                separados en R y en Python, una entrada por lenguaje con «(R)» / «(Python)» en el título
#   origen       Propio | Recomendado
#   autoria      (opcional) coautoría o autoría ajena
#   serie        (opcional) proyecto o colección al que pertenece (se muestra como etiqueta), p. ej. Unidigital-Prodigital
#   nota         (opcional) aviso breve, p. ej. acceso restringido

