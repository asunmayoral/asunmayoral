- title: Protección, gestión y compartición de contenidos digitales
  description: Para la creación, reutilización y protección de contenidos educativos digitales es fundamental conocer los tipos y características básicas de los licenciamientos existentes. Hablamos sobre la permisibilidad de uso con fines educativos en función del tipo de licencia, y en particular de las licencias Creative Commons. Hablamos sobre la gestión y compartición eficaz de contenidos digitales a través de criterios estándar de catalogación, y ofrecemos recursos y pautas para recopilar, seleccionar, organizar y compartir eficazmente contenidos digitales. 4 módulos, 2 h.
