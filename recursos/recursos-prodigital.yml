- title: Creación colaborativa en la red
  description: La colaboración en red es especialmente útil en nuestra época. Repasamos las consideraciones básicas para una colaboración virtual eficaz y saludable, proporcionamos herramientas con las que agendar y planificar proyectos colaborativos con otros usuarios, y revisamos diversas herramientas web para la colaboración y la cocreación de contenidos. Hablamos también sobre la colaboración en Wikipedia. 6 módulos, 3 h.
