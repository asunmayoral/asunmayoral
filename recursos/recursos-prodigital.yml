- title: Búsqueda y selección de contenidos digitales
  description: Como docentes necesitamos estar en continua actualización, y para ello es importante dominar estrategias eficientes de búsqueda, aplicar criterios eficaces de selección de contenidos fiables y de calidad, y conocer a la vez repositorios generales y específicos relacionados con la docencia y la investigación. Hablamos sobre todo ello en este curso. 4 módulos, 2 h.
