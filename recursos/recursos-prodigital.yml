- title: Identidad digital, participación ciudadana y comportamiento en la red
  description: Vivimos interactuando en red y generando una huella digital de la que a veces no somos conscientes. Hablamos sobre identidad, huella y reputación digital, y cómo gestionarlas, así como sobre buenas prácticas para la comunicación en red. Te informamos sobre cómo crear tu identidad digital para resolver trámites online en la Administración Pública. Recordamos los derechos que, como ciudadanos, tenemos sobre nuestra identidad digital, y te damos un decálogo de buenas prácticas para cuidar tu reputación digital. Repasamos también la gestión de cookies para garantizar una navegación segura en internet. 6 módulos, 3 h.
