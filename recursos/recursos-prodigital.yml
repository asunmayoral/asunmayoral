- title: Compartir en la red
  description: Es importante conocer todos los recursos en red de los que disponemos para almacenar y organizar contenidos digitales de cualquier tipo. Saber además cómo compartirlo con otros a través de diversas herramientas web, es básico para un ciudadano del siglo XXI. 6 módulos, 3 h.
