# Docencia. Una entrada por asignatura, curso o trabajo dirigido. De aquí salen las tarjetas de
# «Asignaturas que imparto», la línea temporal y las listas de los acordeones de docencia/index.qmd.
# (El acordeón «Innovación docente y proyectos formativos» sale de proyectos/proyectos.yml.)
# Grado, licenciaturas y másteres de la UMH: confirmados por Asun a partir del CVN de docencia (nov. 2026).
# Los TFG y TFM dirigidos NO van aquí: salen de docencia/trabajos.yml, que genera scripts/trabajos_desde_excel.py
# a partir de fuentes/TFG_TFM_dirigidos.xlsx. Las tesis dirigidas están en investigacion/investigacion.yml.
#
# Campos:
#   title      nombre de la asignatura o curso (o título del trabajo dirigido)
#   bloque     grado | licenciatura | postgrado | continua | profesorado
#   desde      año de inicio (número)
#   hasta      año final (número). Sin `hasta` = se sigue impartiendo: sale destacada y con la etiqueta «En curso»
#   anios      (opcional) texto de años si no vale el automático «desde–hasta»
#   detalle    titulación y, tras un punto, lo demás (horas, papel, código...). Sin punto final. Admite HTML sencillo
#   enlaces    (opcional) lista de {texto, url}. Enlaces internos con ruta desde la raíz: /blog/posts/.../index.html
#   corto      (opcional) nombre abreviado para la barra de la línea temporal
#   id         (opcional) ancla fija, si otra página enlaza a esta entrada
#   tarjeta    (opcional) true = sale además como tarjeta en «Asignaturas que imparto». No la marca como actual.
#              La tarjeta pone arriba la titulación (el `detalle` hasta el primer punto) y debajo el resto.
#              `path` (enlace del título) es opcional: sin él se usa el primer enlace
#   ediciones  (opcional) lista de {anio, programa, universidad} para cursos con varias ediciones
#   cursos     (opcional) lista de {anio, title, horas} para un programa que agrupa varios cursos (p. ej. IA4legos)
# El orden de las listas es automático: primero lo que está en curso y después de lo más reciente a lo más antiguo.

