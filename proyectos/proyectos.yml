# Proyectos y contratos. Ya no hay página Proyectos: cada entrada sale en Docencia, Divulgación o Investigación
# según su `categoria`. Fuente principal: CVN de Asun (completo, dic. 2025) y entradas del blog.
# Campos:
#   title        nombre del proyecto
#   categoria    Innovación docente | Materiales formativos (salen en Docencia) · Divulgación (sale en Divulgación)
#                · Investigación | Contratos (salen en Investigación)
#   estado       Activo | Histórico   (los activos salen también en la portada)
#   anios        texto con las fechas ("2021-2022", "Desde 2022-23")
#   orden        número para ordenar dentro de cada categoría (mayor = antes; usa el año de inicio)
#   linea        (opcional) línea de investigación: bayes | ambiente | salud | educacion | ia | sociedad.
#                Con `linea`, `desde` y `hasta` (años) el proyecto aparece también en la página Investigación
#                y en su línea temporal.
#   desde, hasta (opcional) años de inicio y fin. Los de Innovación docente y Competencia digital los usa
#                la línea temporal de Docencia.
#   description  qué es, en una o dos frases
#   papel        (opcional) equipo o IP (IP = quien figura como director en el CVN)
#   financiacion (opcional) entidad y código de la convocatoria (sin importes)
#   detalle      (opcional) lista de líneas para series de contratos o ediciones
#   path         (opcional) enlace principal
#   mas          (opcional) segundo enlace, p. ej. la entrada del blog
#   mas_texto    (opcional) texto de ese segundo enlace
#   mas2, mas2_texto (opcional) un tercer enlace y su texto
#   mas3, mas3_texto (opcional) un cuarto enlace y su texto

