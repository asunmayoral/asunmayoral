project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
  resources:
    - "files/**"
    - "images/**"
    - "divulgacion/jic/**/*.pdf"
    - "divulgacion/fecitelx/*.pdf"
    - "divulgacion/fecitelx/*.png"

lang: es

website:
  title: "My Stat Space"
  description: "Asun M. Mayoral. Aprender, enseñar y contar con Estadística e IA."
  site-url: "https://asunmayoral.umh.es"
  favicon: images/favicon.svg
  open-graph: true
  page-navigation: false
  search:
    location: navbar
    type: overlay
  navbar:
    title: "My Stat Space"
    background: light
    collapse-below: lg
    left:
      - text: Docencia
        href: docencia/index.qmd
      - text: Investigación
        href: investigacion/index.qmd
      - text: Divulgación
        href: divulgacion/index.qmd
      - text: Recursos
        href: recursos/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: Sobre mí
        href: sobre-mi/index.qmd
  page-footer:
    background: "#2F2A36"
    left: |
      **My Stat Space** · Mª Asunción Martínez Mayoral<br>
      Área de Estadística e Investigación Operativa · Departamento de Estadística, Matemáticas e Informática<br>
      Instituto Universitario de Investigación en Matemáticas, Ciencia de Datos e Inteligencia Artificial, i-MInD<br>
      Universidad Miguel Hernández de Elche<br>
      Edificio Torrepinet, planta 1, despacho 25 · [asun.mayoral@umh.es](mailto:asun.mayoral@umh.es)
    right:
      - text: Google Scholar
        href: https://scholar.google.es/citations?user=8QU4Vp8AAAAJ&hl=es
      - text: ORCID
        href: https://orcid.org/0000-0001-6944-7335
      - text: LinkedIn
        href: https://www.linkedin.com/in/asunmayoral/
      - text: GitHub
        href: https://github.com/asunmayoral
      - text: YouTube
        href: https://www.youtube.com/channel/UCccvZ4InlmdutYsFSGy29-Q
      - text: RSS
        href: blog/index.xml

format:
  html:
    theme:
      light: [cosmo, styles/mystat.scss]
    toc: false
    include-after-body: _templates/acordeon.html
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    title-block-banner: true
    title-block-banner-color: "#2F2A36"
    highlight-style: github
    grid:
      body-width: 1060px
      margin-width: 220px

execute:
  freeze: auto
